config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "tunnel_11111111111111111111111111111111"
  api_key: "file:/tmp/buddy-runtime/control-plane-api-key"
health:
  listen_addr: "127.0.0.1:0"
  url_file: "/tmp/buddy-runtime/health.url"
process:
  pid_file: "/tmp/buddy-runtime/tunnel-client.pid"
log:
  level: info
  format: json
  file: "/tmp/buddy-runtime/tunnel-client.log"
mcp:
  server_urls:
    - channel: main
      url: "http://127.0.0.1:8766/mcp"
  commands:
    - channel: rea
      command: "/usr/bin/node /root/rea/scripts/rea.mjs mcp"
  extra_headers:
    Authorization: "file:/tmp/buddy-runtime/buddy-auth-header"
  discovery_extra_headers:
    Authorization: "file:/tmp/buddy-runtime/buddy-discovery-auth-header"
