name: Buddy Autonomous Runtime Audit

on:
  push:
    branches:
      - feature/buddy-autonomous-runtime-audit-20261124
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Source and architecture audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Run read-only source audit
        run: python3 scripts/autonomous_runtime_source_audit.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autonomous-runtime-source-audit
          path: build/reports/autonomous-runtime-audit.json

  existing-helper-tests:
    name: Existing Buddy helper regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: MCP SSE parser tests
        run: node --test mcp-bridge/sse-response.test.mjs
      - name: Recorded agent output tests
        run: bash linux/test/run.sh

  tunnel-client-runtime:
    name: Pinned Tunnel Client runtime tests and Linux ARM64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout audited Tunnel Client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/tunnel-client
          ref: 01d67bb4da0d8359b808b4761f8db171ab682cd7
          path: tunnel-client
      - name: Apply runtime procfs hardening patch
        run: python3 scripts/patch_tunnel_client_runtime.py tunnel-client
      - name: Validate Buddy profile against pinned Tunnel Client schema
        run: |
          cp app/src/test/resources/buddy-myai-tunnel-profile.yaml tunnel-client/buddy-profile-validation.yaml
          cat > tunnel-client/pkg/runtimeconfig/buddy_profile_validation_test.go <<'EOF'
          package runtimeconfig

          import (
            "os"
            "testing"
          )

          func TestBuddyGeneratedProfileAcceptedByPinnedRuntime(t *testing.T) {
            data, err := os.ReadFile("../../buddy-profile-validation.yaml")
            if err != nil {
              t.Fatalf("read Buddy profile fixture: %v", err)
            }
            if err := ValidateFullProfileBytes("buddy-profile-validation.yaml", data); err != nil {
              t.Fatalf("pinned Tunnel Client rejected Buddy profile: %v", err)
            }
          }
          EOF
      - name: Run upstream runtime-focused Go tests
        run: |
          docker run --rm --cap-drop=SYS_PTRACE \
            -v "$PWD/tunnel-client:/src" \
            -w /src \
            golang:1.27.3-alpine \
            go test ./pkg/cloudflared/runtime ./pkg/runtimeconfig ./pkg/runtimehealth ./pkg/mcpclient ./pkg/mcpserverinfo ./cmd/client-runtime
      - name: Build Linux ARM64 Tunnel Client and cloudflared companions
        run: |
          mkdir -p "$RUNNER_TEMP/tunnel-runtime" dist
          docker run --rm --cap-drop=SYS_PTRACE \
            -v "$PWD/tunnel-client:/src" \
            -v "$PWD:/buddy" \
            -v "$RUNNER_TEMP/tunnel-runtime:/out" \
            -w /src \
            -e CGO_ENABLED=0 \
            -e GOOS=linux \
            -e GOARCH=arm64 \
            golang:1.27.3-alpine sh -c '
              set -eu
              go build -mod=readonly -trimpath -buildvcs=false -o /out/tunnel-client-runtime ./cmd/client-runtime
              go mod download github.com/cloudflare/cloudflared@v0.0.0-20261020083048-002a5ccaf75a
              MOD_DIR="$(go env GOPATH)/pkg/mod/github.com/cloudflare/cloudflared@v0.0.0-20261020083048-002a5ccaf75a"
              chmod -R u+w "$MOD_DIR"
              apk add --no-cache python3 >/dev/null
              python3 /buddy/scripts/patch_cloudflared_module.py "$MOD_DIR"
              cd "$MOD_DIR"
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./cmd/cloudflared -run "^TestCloudflaredHidesEnvironmentFromSameUidProcess$" -count=1
              go build -trimpath -buildvcs=false -ldflags "-s -w -X main.Version=2026.10.2 -X main.BuildTime=2026-11-24 -X main.BuildType=buddy" -o /out/cloudflared ./cmd/cloudflared
            '
          file "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime" "$RUNNER_TEMP/tunnel-runtime/cloudflared"
          sha256sum "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime" "$RUNNER_TEMP/tunnel-runtime/cloudflared"
          cp "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime" "$RUNNER_TEMP/tunnel-runtime/cloudflared" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: |
            dist/tunnel-client-runtime
            dist/cloudflared

  tunnel-client-arm64-smoke:
    name: Execute pinned Tunnel Client on native ARM64 runner
    needs: tunnel-client-runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: dist
      - name: Verify and execute native ARM64 runtime
        run: |
          file dist/tunnel-client-runtime dist/cloudflared
          readelf -h dist/tunnel-client-runtime | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          readelf -h dist/cloudflared | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          ! readelf -l dist/tunnel-client-runtime | grep -q INTERP
          ! readelf -l dist/cloudflared | grep -q INTERP
          echo '35638eb6293299cfdf20f8cc23e58551fed361477d72ff8fc7fd7095b4d6ba39  dist/tunnel-client-runtime' | sha256sum --check
          sha256sum dist/cloudflared
          chmod 700 dist/tunnel-client-runtime dist/cloudflared
          test "$(dist/tunnel-client-runtime version)" = "0.0.19"
          dist/cloudflared --version | grep -F '2026.10.2'

  rea-mcp-alpine-arm64-smoke:
    name: REA 6.5.0 MCP smoke test on Alpine ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install and validate pinned REA package in Alpine ARM64
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            node:26.13.1-alpine3.24 sh -c '
              set -eu
              apk add --no-cache python3 make g++ linux-headers git >/dev/null
              mkdir -p /tmp/rea-package
              npm pack rea-agents@6.5.0 --pack-destination /tmp/rea-package >/dev/null
              mkdir -p /root/rea
              tar -xzf /tmp/rea-package/rea-agents-6.5.0.tgz -C /root/rea --strip-components=1
              cd /root/rea
              npm install --omit=dev --no-audit --no-fund
              node scripts/rea.mjs mcp doctor --format json > /work/dist/rea-mcp-doctor.json
              node /work/scripts/verify_rea_mcp_doctor.mjs /work/dist/rea-mcp-doctor.json
              cp /tmp/rea-package/rea-agents-6.5.0.tgz /work/dist/
              node --version
              npm --version
            '
          sha256sum dist/rea-agents-6.5.0.tgz dist/rea-mcp-doctor.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rea-agents-6.5.0-alpine-arm64-smoke
          path: |
            dist/rea-agents-6.5.0.tgz
            dist/rea-mcp-doctor.json

  android-baseline-build:
    name: Buddy Android baseline build with pinned runtime payload
    needs: [tunnel-client-runtime, tunnel-client-arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: dist
      - name: Verify pinned runtime payload
        run: |
          echo '35638eb6293299cfdf20f8cc23e58551fed361477d72ff8fc7fd7095b4d6ba39  dist/tunnel-client-runtime' | sha256sum --check
          sha256sum dist/cloudflared
      - name: Stage runtime as Android native executables
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp dist/tunnel-client-runtime app/src/main/jniLibs/arm64-v8a/libtunnel-client.so
          cp dist/cloudflared app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libtunnel-client.so app/src/main/jniLibs/arm64-v8a/libcloudflared.so
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run Buddy JVM unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
      - name: Assemble existing side-by-side debug APK
        run: ./gradlew --no-daemon assembleGithubDebug
      - name: Verify APK signature and package metadata
        run: |
          APK="$(find app/build/outputs/apk/github/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='app.buddy.myai.test219'"
          echo "$BADGING" | grep -F "versionCode='216'"
          unzip -p "$APK" lib/arm64-v8a/libtunnel-client.so | sha256sum | grep -F '35638eb6293299cfdf20f8cc23e58551fed361477d72ff8fc7fd7095b4d6ba39'
          unzip -p "$APK" lib/arm64-v8a/libcloudflared.so | sha256sum
          mkdir -p dist
          cp "$APK" dist/buddy-baseline-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-autonomous-runtime-baseline-debug
          path: dist/buddy-baseline-debug.apk
