name: Buddy Autonomous Runtime Audit

on:
  push:
    branches:
      - feature/buddy-autonomous-runtime-audit-20261124
      - fix/buddy-runtime-cloudflared-flavor-20261125
      - fix/buddy-mcp-runtime-independent-20261127
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  source-audit:
    name: Source and architecture audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Run read-only source audit
        run: python3 scripts/autonomous_runtime_source_audit.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autonomous-runtime-source-audit
          path: build/reports/autonomous-runtime-audit.json

  existing-helper-tests:
    name: Existing Buddy helper regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: MCP SSE parser tests
        run: node --test mcp-bridge/sse-response.test.mjs
      - name: Recorded agent output tests
        run: bash linux/test/run.sh

  tunnel-client-runtime:
    name: Pinned standard Tunnel Client runtime tests and Linux ARM64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout audited Tunnel Client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/tunnel-client
          ref: 01d67bb4da0d8359b808b4761f8db171ab682cd7
          path: tunnel-client
      - name: Apply runtime procfs hardening patch
        run: python3 scripts/patch_tunnel_client_runtime.py tunnel-client
      - name: Validate Buddy and helper profiles against pinned standard runtime schema
        run: |
          cp app/src/test/resources/buddy-myai-tunnel-profile.yaml tunnel-client/buddy-profile-validation.yaml
          cp app/src/test/resources/rea-mcp-tunnel-profile.yaml tunnel-client/rea-profile-validation.yaml
          cp app/src/test/resources/bridge-mcp-tunnel-profile.yaml tunnel-client/bridge-profile-validation.yaml
          cp app/src/test/resources/droidmcp-tunnel-profile.yaml tunnel-client/droidmcp-profile-validation.yaml
          cat > tunnel-client/pkg/runtimeconfig/buddy_profile_validation_test.go <<'EOF'
          package runtimeconfig

          import (
            "os"
            "testing"
          )

          func TestBuddyGeneratedProfilesAcceptedByPinnedRuntime(t *testing.T) {
            for _, name := range []string{"buddy-profile-validation.yaml", "bridge-profile-validation.yaml", "droidmcp-profile-validation.yaml", "rea-profile-validation.yaml"} {
              data, err := os.ReadFile("../../" + name)
              if err != nil {
                t.Fatalf("read profile fixture %s: %v", name, err)
              }
              if err := ValidateFullProfileBytes(name, data); err != nil {
                t.Fatalf("pinned Tunnel Client rejected %s: %v", name, err)
              }
            }
          }
          EOF
          cat > tunnel-client/pkg/runtimeconfig/buddy_profile_runtime_test.go <<'EOF'
          package runtimeconfig

          import (
            "os"
            "path/filepath"
            "strings"
            "testing"

            "github.com/spf13/pflag"
          )

          func TestBuddyProfileUsesStandardRuntimeWithoutCloudflared(t *testing.T) {
            data, err := os.ReadFile("../../buddy-profile-validation.yaml")
            if err != nil {
              t.Fatal(err)
            }
            if strings.Contains(string(data), "cloudflared:") {
              t.Fatal("Buddy profile must match the working no-cloudflared tunnel configuration")
            }
            dir := t.TempDir()
            profile := strings.ReplaceAll(string(data), "/tmp/buddy-runtime", dir)
            for name, value := range map[string]string{
              "control-plane-api-key": "test-api-key",
              "buddy-auth-header": "Bearer test",
              "buddy-discovery-auth-header": "Bearer test",
            } {
              if err := os.WriteFile(filepath.Join(dir, name), []byte(value), 0o600); err != nil {
                t.Fatal(err)
              }
            }
            configPath := filepath.Join(dir, "buddy.yaml")
            if err := os.WriteFile(configPath, []byte(profile), 0o600); err != nil {
              t.Fatal(err)
            }

            flags := pflag.NewFlagSet("runtime", pflag.ContinueOnError)
            RegisterFlags(flags, FlavorRuntime)
            if err := flags.Parse([]string{"--config", configPath}); err != nil {
              t.Fatal(err)
            }
            if _, err := LoadFromFlagSet(flags, func(string) (string, bool) {
              return "", false
            }); err != nil {
              t.Fatalf("standard runtime rejected Buddy profile: %v", err)
            }

            unsupported := strings.Replace(string(data), "health:\n", "cloudflared:\n  path: /tmp/cloudflared\nhealth:\n", 1)
            unsupported = strings.ReplaceAll(unsupported, "/tmp/buddy-runtime", dir)
            if err := os.WriteFile(configPath, []byte(unsupported), 0o600); err != nil {
              t.Fatal(err)
            }
            badFlags := pflag.NewFlagSet("runtime-cloudflared-settings-rejected", pflag.ContinueOnError)
            RegisterFlags(badFlags, FlavorRuntime)
            if err := badFlags.Parse([]string{"--config", configPath}); err != nil {
              t.Fatal(err)
            }
            if _, err := LoadFromFlagSet(badFlags, func(string) (string, bool) {
              return "", false
            }); err == nil || !strings.Contains(err.Error(), "runtime configuration rejects cloudflared settings") {
              t.Fatalf("standard runtime should reject an injected cloudflared setting, got: %v", err)
            }
          }
          EOF
      - name: Run upstream runtime-focused Go tests
        run: |
          docker run --rm --cap-drop=SYS_PTRACE \
            -v "$PWD/tunnel-client:/src" \
            -w /src \
            golang:1.27.3-alpine \
            go test ./pkg/runtimeconfig ./pkg/runtimehealth ./pkg/mcpclient ./pkg/mcpserverinfo ./cmd/client-runtime
      - name: Build Linux ARM64 standard Tunnel Client runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tunnel-runtime" dist
          docker run --rm --cap-drop=SYS_PTRACE \
            -v "$PWD/tunnel-client:/src" \
            -v "$RUNNER_TEMP/tunnel-runtime:/out" \
            -w /src \
            -e CGO_ENABLED=0 \
            -e GOOS=linux \
            -e GOARCH=arm64 \
            golang:1.27.3-alpine sh -c '
              set -eu
              go build -mod=readonly -trimpath -buildvcs=false -ldflags "-X github.com/openai/tunnel-client/pkg/version.Flavor=runtime -X github.com/openai/tunnel-client/pkg/version.GitSHA=01d67bb4da0d8359b808b4761f8db171ab682cd7 -X github.com/openai/tunnel-client/pkg/version.BuildFlags=-trimpath,-buildvcs=false" -o /out/tunnel-client-runtime ./cmd/client-runtime
            '
          file "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime"
          sha256sum "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime"
          cp "$RUNNER_TEMP/tunnel-runtime/tunnel-client-runtime" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: dist/tunnel-client-runtime

  tunnel-client-arm64-smoke:
    name: Execute pinned Tunnel Client on native ARM64 runner
    needs: tunnel-client-runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rea-agents-6.5.0-alpine-arm64-smoke
          path: rea-dist
      - name: Stage pinned REA package for first-run bootstrap
        run: |
          mkdir -p app/src/main/assets/runtime
          cp rea-dist/rea-agents-6.5.0.tgz app/src/main/assets/runtime/
      - name: Verify and execute native ARM64 runtime
        run: |
          file dist/tunnel-client-runtime
          readelf -h dist/tunnel-client-runtime | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          ! readelf -l dist/tunnel-client-runtime | grep -q INTERP
          echo 'f7c651958ffebf6e495d72f1406ee7603b6ebab3b77c211f9071e4b54904fb0e  dist/tunnel-client-runtime' | sha256sum --check
          chmod 700 dist/tunnel-client-runtime
          dist/tunnel-client-runtime --version | tee /tmp/tunnel-client-runtime-version.txt
          grep -F '0.0.19' /tmp/tunnel-client-runtime-version.txt
          grep -F 'flavor=runtime' /tmp/tunnel-client-runtime-version.txt

  rea-mcp-alpine-arm64-smoke:
    name: REA 6.5.0 MCP smoke test on Alpine ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install and validate pinned REA package in Alpine ARM64
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            alpine:3.24.2 sh -c '
              set -eu
              apk add --no-cache nodejs-current npm python3 make g++ linux-headers git openjdk21-jre-headless android-tools >/dev/null
              mkdir -p /tmp/rea-package /root/rea
              npm pack rea-agents@6.5.0 --pack-destination /tmp/rea-package >/dev/null
              tar -xzf /tmp/rea-package/rea-agents-6.5.0.tgz -C /root/rea --strip-components=1
              cd /root/rea
              npm install --omit=dev --no-audit --no-fund
              REA_ROOT=/root/rea
              REA_MCP_INPUT_SCHEMA_PROFILE=compact REA_MCP_OUTPUT_SCHEMA_PROFILE=off REA_MCP_MAX_RESPONSE_BYTES=10485760 node "$REA_ROOT/scripts/rea.mjs" mcp doctor --format json > /work/dist/rea-mcp-doctor.json
              node /work/scripts/verify_rea_mcp_doctor.mjs /work/dist/rea-mcp-doctor.json
              cp /work/scripts/rea_tools_list_probe.mjs /root/rea/scripts/
              cp /tmp/rea-package/rea-agents-6.5.0.tgz /work/dist/
              node /root/rea/scripts/rea_tools_list_probe.mjs /root/rea/scripts/rea.mjs > /work/dist/rea-mcp-tools-probe.json
              cp /work/app/src/main/assets/runtime/termux-bridge-0.1.3.mjs /root/rea/scripts/bridge.mjs
              cp /work/app/src/main/assets/runtime/droidmcp-filesystem-0.4.0.mjs /root/rea/scripts/droidmcp.mjs
              git clone --depth 1 --branch rea-agents-6.5.0 https://github.com/morluto/rea.git /root/rea-source
              test "$(git -C /root/rea-source rev-parse HEAD)" = "3b79af28e80785afce9f5998d8f03289402a1847"
              mkdir -p /root/bridge/server /root/droidmcp/server /system /apex /vendor /product /system_ext
              cp /root/rea/scripts/bridge.mjs /root/bridge/server/index.mjs
              cp /root/rea/scripts/droidmcp.mjs /root/droidmcp/server/index.mjs
              node --check /root/bridge/server/index.mjs
              node --check /root/droidmcp/server/index.mjs
              cp /work/scripts/helper_mcp_catalog_probe.mjs /root/rea/scripts/
              node /root/rea/scripts/helper_mcp_catalog_probe.mjs /root/rea/scripts/bridge.mjs /root/rea/scripts/droidmcp.mjs > /work/dist/helper-mcp-probe.json
              node --version
              npm --version
              java -version
              adb version
              apk info -v nodejs-current
            '
          sha256sum dist/rea-agents-6.5.0.tgz dist/rea-mcp-doctor.json dist/rea-mcp-tools-probe.json dist/helper-mcp-probe.json app/src/main/assets/runtime/termux-bridge-0.1.3.mjs app/src/main/assets/runtime/droidmcp-filesystem-0.4.0.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rea-agents-6.5.0-alpine-arm64-smoke
          path: |
            dist/rea-agents-6.5.0.tgz
            dist/rea-mcp-doctor.json
            dist/rea-mcp-tools-probe.json
            dist/helper-mcp-probe.json

  android-baseline-build:
    name: Buddy Android baseline build with pinned runtime payload
    needs: [tunnel-client-runtime, tunnel-client-arm64-smoke, rea-mcp-alpine-arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tunnel-client-v0.0.19-linux-arm64-runtime
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rea-agents-6.5.0-alpine-arm64-smoke
          path: rea-dist
      - name: Stage and verify pinned REA package for Android APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/runtime
          test -s rea-dist/rea-agents-6.5.0.tgz
          echo '531717a06e92ca651aab52691190f916fac044272c01f875e22c5e293218e699  rea-dist/rea-agents-6.5.0.tgz' | sha256sum --check
          cp rea-dist/rea-agents-6.5.0.tgz app/src/main/assets/runtime/rea-agents-6.5.0.tgz
          echo 'REA_PACKAGE_STAGED=1' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify pinned runtime payload
        run: |
          echo 'f7c651958ffebf6e495d72f1406ee7603b6ebab3b77c211f9071e4b54904fb0e  dist/tunnel-client-runtime' | sha256sum --check
          sha256sum dist/tunnel-client-runtime
      - name: Stage runtime as Android native executables
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp dist/tunnel-client-runtime app/src/main/jniLibs/arm64-v8a/libtunnel-client.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libtunnel-client.so
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run Buddy JVM unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
      - name: Assemble isolated side-by-side test220 debug APK
        run: ./gradlew --no-daemon assembleGithubDebug
      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/github/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS" && test -x "$BUILD_TOOLS/apksigner" && test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signature-verification.txt
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='app.buddy.myai.gt.test221'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='220'"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libtunnel-client.so'
          unzip -Z1 "$APK" | grep -Fx 'assets/runtime/rea-agents-6.5.0.tgz'
          unzip -Z1 "$APK" | grep -Fx 'assets/runtime/termux-bridge-0.1.3.mjs'
          unzip -Z1 "$APK" | grep -Fx 'assets/runtime/droidmcp-filesystem-0.4.0.mjs'
          REA_SHA="$(unzip -p "$APK" assets/runtime/rea-agents-6.5.0.tgz | sha256sum | cut -d ' ' -f1)"
          test "$REA_SHA" = '531717a06e92ca651aab52691190f916fac044272c01f875e22c5e293218e699'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libbuddy.so' || true
          RUNTIME_SHA="$(unzip -p "$APK" lib/arm64-v8a/libtunnel-client.so | sha256sum | cut -d ' ' -f1)"
          test "$RUNTIME_SHA" = 'f7c651958ffebf6e495d72f1406ee7603b6ebab3b77c211f9071e4b54904fb0e'
          if unzip -Z1 "$APK" | grep -Eq 'lib/arm64-v8a/libcloudflared\.so'; then
            echo 'Unexpected cloudflared payload in standard runtime APK' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/buddy-runtimefix-debug.apk
          sha256sum dist/buddy-runtimefix-debug.apk | tee dist/apk-sha256.txt
      - name: Record isolated candidate signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/buddy-runtimefix-debug.apk'
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS" && test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signing-identity.txt
          grep -Eq 'certificate SHA-256 digest: [0-9a-fA-F]{64}' dist/apk-signing-identity.txt
          echo "PACKAGE_ISOLATION=app.buddy.myai.gt.test221" >> "$GITHUB_STEP_SUMMARY"
          echo "The candidate uses a new package ID and is installed side-by-side; it does not replace test220 or the production package." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-runtimefix-test221-debug
          path: |
            dist/buddy-runtimefix-debug.apk
            dist/apk-signature-verification.txt
            dist/apk-signing-identity.txt
            dist/apk-sha256.txt
