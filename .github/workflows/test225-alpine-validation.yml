name: Test225 Alpine validation

on:
  pull_request:
    branches:
      - fix/test225-restore-test220-main-tunnel-20261127
    paths:
      - "app/src/main/java/app/buddy/assistant/Linux.java"
      - "app/src/main/java/app/buddy/assistant/AlpineRootValidator.java"
      - "app/src/test/java/app/buddy/assistant/AlpineRootValidatorTest.java"
      - "app/build.gradle.kts"
      - ".github/workflows/test225-alpine-validation.yml"
  push:
    branches:
      - fix/test225-alpine-root-validation-20261128

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest

      - name: Build separate Test225 APK
        run: ./gradlew --no-daemon :app:assembleGithubDebug

      - name: Upload Test225 APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Test225-Alpine-validation
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7
