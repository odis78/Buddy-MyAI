name: Build

on:
  push:
    branches: [main, "test/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # buddy-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test MCP SSE response parser
        run: node --test mcp-bridge/sse-response.test.mjs
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true # proot and libandroid-shmem (third_party/)

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # A manually dispatched GT release build must never silently produce an unsigned APK.
      # The certificate fingerprint is a separate secret so the configured key identity is pinned.
      - name: Require GT release signing material
        if: github.ref == 'refs/heads/experiment/tunnel-client-v0.0.21-oauth-20261125' && github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.BUDDY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Missing secret BUDDY_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$KEYSTORE_PASSWORD" ]] || { echo "::error::Missing secret BUDDY_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Missing secret BUDDY_CERT_SHA256"; exit 1; }

      - name: Decode and verify GT release signing key
        if: github.ref == 'refs/heads/experiment/tunnel-client-v0.0.21-oauth-20261125' && github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.BUDDY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          alias="${KEY_ALIAS:-buddy}"
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$alias" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::Could not read a SHA-256 certificate fingerprint from the configured keystore"; exit 1; }
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::BUDDY_CERT_SHA256 must contain a  SHA-256 certificate fingerprint"; exit 1; }
          [[ "$actual" == "$expected" ]] || { echo "::error::Release keystore certificate fingerprint does not match BUDDY_CERT_SHA256"; exit 1; }
          {
            echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BUDDY_KEY_ALIAS=$alias"
            echo "BUDDY_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Verified configured release certificate fingerprint: $actual"

      # github: the release here. fdroid: F-Droid builds it from this source too, and ships this signed copy when its
      # own build comes out identical (reproducible builds), so users can switch between the two.
      - name: Build release APKs (GitHub and F-Droid)
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          BUDDY_KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
          BUDDY_KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Verify GT release APK signature and certificate identity
        if: github.ref == 'refs/heads/experiment/tunnel-client-v0.0.21-oauth-20261125' && github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.BUDDY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH"
          apk="$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)"
          test -n "$apk"
          apksigner verify --verbose "$apk"
          actual="$(apksigner verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" == "$expected" ]] || { echo "::error::Signed APK certificate fingerprint does not match BUDDY_CERT_SHA256"; exit 1; }
          echo "GT release APK signature and certificate fingerprint verified"

      - name: Build installable side-by-side test APK
        if: startsWith(github.ref, 'refs/heads/test/') || github.event_name == 'pull_request'
        run: ./gradlew --no-daemon assembleGithubDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" "dist/buddy-${GITHUB_REF_NAME//\//-}.apk"
          # fixed name too, so releases/latest/download/buddy.apk always gets the newest version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then cp "$apk" dist/buddy.apk; fi
          fd=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          # named so nobody picks it by mistake: it doesn't update itself (F-Droid's Binaries line must match this name)
          cp "$fd" "dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk"
          echo "FDROID_APK=$PWD/dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/heads/test/* || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test_apk=$(find app/build/outputs/apk/github/debug -name '*.apk' | head -1)
            cp "$test_apk" dist/buddy-myai-test.apk
          fi
          ls -l dist

      - name: Verify installable test APK
        if: startsWith(github.ref, 'refs/heads/test/') || github.event_name == 'pull_request'
        run: |
          test_apk=dist/buddy-myai-test.apk
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH"
          apksigner verify --verbose "$test_apk"
          aapt dump badging "$test_apk" | grep -F "package: name='app.buddy.myai.test219'"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Buddy $GITHUB_REF_NAME" --generate-notes
          fi
          # which of the APKs to download, at the end of the notes (once)
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          case "$notes" in
            *"Which file?"*) ;;
            *) printf '%s\n\n%s\n' "$notes" "**Which file?** Download `buddy.apk`: it updates itself. Buddy is also on [F-Droid](https://f-droid.org/packages/app.buddy.assistant/), where each version arrives a few days after it is released here. `fdroid-check-only-$GITHUB_REF_NAME.apk` is only there for F-Droid's reproducible-build check, and doesn't update itself." \
                 | gh release edit "$GITHUB_REF_NAME" --notes-file - ;;
          esac

      # What F-Droid will do: build the fdroid APK again, unsigned, somewhere else, and check it matches the signed one
      # above but for the signature. After publishing, so a mismatch shows up red without holding the release back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          path: rebuild-check # a second copy at another path, as F-Droid's build machine would have

      - name: Check the F-Droid APK is reproducible
        run: |
          pip install --quiet apksigcopier
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH" # apksigner
          cd rebuild-check
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
          env -u BUDDY_KEYSTORE ./gradlew --no-daemon assembleFdroidRelease
          unsigned=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          if [[ -n "${BUDDY_KEYSTORE:-}" ]]; then
            # Signed release: compare the APK payload after removing only its signature.
            apksigcopier compare --unsigned "$FDROID_APK" "$unsigned"
          else
            # No release key is configured: both builds are unsigned, so require an exact APK match.
            cmp --silent "$FDROID_APK" "$unsigned" || {
              echo "Unsigned F-Droid APKs differ; reproducible build check failed." >&2
              sha256sum "$FDROID_APK" "$unsigned" >&2
              exit 1
            }
          fi
          echo "The F-Droid APK is reproducible"
