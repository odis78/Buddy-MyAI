name: JITI Control Center Android

on:
  push:
    branches:
      - project/jiti-control-center
    paths:
      - "control-center/**"
      - ".github/workflows/jiti-control-center.yml"
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/jiti-control-center.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle -p control-center assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jiti-control-center-debug
          path: control-center/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
