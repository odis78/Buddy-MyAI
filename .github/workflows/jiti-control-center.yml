name: JITI Control Center Android

on:
  push:
    branches:
      - project/jiti-control-center
    paths:
      - "control-center/**"
      - ".github/workflows/jiti-control-center.yml"
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/jiti-control-center.yml"
  workflow_dispatch:

concurrency:
  group: jiti-control-center-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate embedded Termux Python control scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("control-center/app/src/main/java/app/jiti/controlcenter/termux/TermuxCommandSpec.java").read_text()
          names = ("BUDDY_MCP_AUTH_PROBE_SCRIPT", "BUDDY_LAUNCH_SCRIPT", "BUDDY_STOP_SCRIPT")
          scripts = {}
          for name in names:
              match = re.search(rf'{name} = """\\n(.*?)\\n""";', source, re.S)
              if not match:
                  raise SystemExit(f"{name} text block not found")
              script = match.group(1).replace("\\\\", "\\")
              compile(script, name + ".py", "exec")
              scripts[name] = script
          auth = scripts["BUDDY_MCP_AUTH_PROBE_SCRIPT"]
          assert "BUDDY_AUTH_HEADER" in auth and "BUDDY_TOKEN" in auth
          assert "ProxyHandler({})" in auth and "NoRedirect" in auth
          assert "print(auth)" not in auth
          launch = scripts["BUDDY_LAUNCH_SCRIPT"]
          stop = scripts["BUDDY_STOP_SCRIPT"]
          assert "CONTROL_PLANE_API_KEY" in launch and "BUDDY_TOKEN" in launch
          assert "EXPECTED_TUNNEL_ID" in launch
          assert "signal.SIGTERM" in stop and "signal.SIGKILL" not in stop
          print("All embedded Termux Python scripts compile and pass secret/process-safety guards")
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "${sdkmanager_path}"
          echo "sdkmanager=${sdkmanager_path}" >> "$GITHUB_OUTPUT"
      - name: Install Android platform and build tools
        run: '"${{ steps.android-sdk.outputs.sdkmanager }}" "platforms;android-35" "build-tools;35.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run JVM unit tests
        run: gradle -p control-center testDebugUnitTest
      - name: Assemble debug APK
        run: gradle -p control-center assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jiti-control-center-debug
          path: control-center/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
